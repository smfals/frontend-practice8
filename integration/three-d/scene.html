<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    .back-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
      padding: 8px 16px;
      background: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <a href=" " class="back-btn">← 返回首页</a >

  <!-- three.js r128稳定版本 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 场景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); //天空蓝

    // 相机
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 8, 12);

    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 轨道控制器
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff,0.8);
    dirLight.position.set(10,20,10);
    scene.add(dirLight);

    // ====== 校园模型 ======
    // 1.大草地地面
    const groundGeo = new THREE.PlaneGeometry(40, 40);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 2.教学楼主体
    function createBuilding(x,z){
      const buildingGeo = new THREE.BoxGeometry(6,4,3);
      const buildingMat = new THREE.MeshLambertMaterial({color:0xf5f5f5});
      const building = new THREE.Mesh(buildingGeo,buildingMat);
      building.position.set(x,2,z);
      building.castShadow = true;
      scene.add(building);
    }
    createBuilding(0,0);
    createBuilding(-8,-5);

    // 3.树木
    function createTree(x,z){
      //树干
      const trunkGeo = new THREE.CylinderGeometry(0.3,0.3,2,8);
      const trunkMat = new THREE.MeshLambertMaterial({color:0x8B4513});
      const trunk = new THREE.Mesh(trunkGeo,trunkMat);
      trunk.position.set(x,1,z);
      trunk.castShadow = true;
      scene.add(trunk);
      //树冠
      const crownGeo = new THREE.SphereGeometry(1.2,8,6);
      const crownMat = new THREE.MeshLambertMaterial({color:0x2E7D32});
      const crown = new THREE.Mesh(crownGeo,crownMat);
      crown.position.set(x,3,z);
      crown.castShadow = true;
      scene.add(crown);
    }
    createTree(5,3);
    createTree(-4,6);
    createTree(7,-4);
    createTree(-6,-2);

    // 4.道路
    const roadGeo = new THREE.PlaneGeometry(2,16);
    const roadMat = new THREE.MeshLambertMaterial({color:0x757575});
    const road = new THREE.Mesh(roadGeo,roadMat);
    road.rotation.x = -Math.PI/2;
    road.position.y = 0.01;
    scene.add(road);

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

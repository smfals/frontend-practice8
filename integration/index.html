<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你校园信息中心</title>
  <!-- Bootstrap CSS 先引入 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自己的样式，必须在Bootstrap后面 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏：4个入口：首页、自习室、统计、校园三维 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href=" ">校园信息中心</a >
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">首页</a ></li>
          <li class="nav-item"><a class="nav-link" href="#studyRoom">自习室</a ></li>
          <li class="nav-item"><a class="nav-link" href="#chart">统计图表</a ></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a ></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <!-- 首页卡片区域 -->
    <section class="row">
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">自习室查询</h5>
            <p class="card-text">查看自习室开放状态，按楼层筛选</p >
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">使用统计</h5>
            <p class="card-text">自习室使用量柱状图</p >
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">校园三维导览</h5>
            <p class="card-text">进入三维校园场景</p >
          </div>
        </div>
      </div>
    </section>

    <!-- 自习室区块占位 -->
    <section id="studyRoom" class="mt-5">
      <h2>自习室查询</h2>
      <div class="filter-box">
        <!-- 筛选按钮占位 -->
      </div>
      <div id="roomList">
        <!-- 自习室列表会在这里渲染 -->
      </div>
    </section>

    <!-- 图表区块占位 -->
    <section id="chart" class="mt-5">
      <h2>自习室使用统计</h2>
      <div id="chartBox" style="height:400px;"></div>
    </section>
  </main>

  <!-- Bootstrap JS，必须放在body末尾 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 自己的js -->
  <script src="js/app.js"></script>
</body>
</html>
